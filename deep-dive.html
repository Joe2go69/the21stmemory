<!DOCTYPE html>
<html lang="en" style="color-scheme:dark;background-color:#0F0A1F">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic pages live in the Codex | 21st Memory</title>
    <meta name="description" content="This old address now opens the Codex. Every topic has its own page there.">
    <link rel="canonical" href="https://21stmemory.com/codex.html">
    <meta name="robots" content="noindex">
    <script>
      (function () {
        // Old links: deep-dive.html?source=X&topic=Y → the topic's own page; anything else → the Codex.
        try {
          var p = new URLSearchParams(location.search);
          if (p.get('source') && p.get('topic')) {
            location.replace('/dive/' + encodeURIComponent(p.get('source')) + '/' + encodeURIComponent(p.get('topic')) + '.html' + location.hash);
            return;
          }
        } catch (e) { /* fall through to the Codex */ }
        location.replace('codex.html' + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=codex.html">
    <meta property="og:url" content="https://21stmemory.com/codex.html">
    <meta property="og:title" content="21st Memory Codex | 21st Memory">
</head>
<body class="cosmic-bg" style="font-family: system-ui, sans-serif; background: #0F0A1F; color: #EDE4FF; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 2rem; text-align: center;">
    <main>
        <p style="margin: 0 0 1rem; font-size: 1.1rem;">Every topic now has its own page in the <strong>Codex</strong>.</p>
        <p style="margin: 0;"><a href="codex.html" style="color: #C4B5FD;">Continue to codex.html →</a></p>
    </main>
</body>
</html>
